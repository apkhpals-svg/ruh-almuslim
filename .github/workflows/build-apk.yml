name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'sw.js'
      - 'manifest.json'
      - 'package.json'
      - 'capacitor.config.json'
      - 'scripts/**'
      - 'q/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: |
          npm install
          python3 -m pip install --quiet pillow

      - name: Prepare web assets (www)
        run: |
          rm -rf www && mkdir www
          cp index.html manifest.json www/
          for f in sw.js icon-192.png icon-512.png icon-maskable-512.png favicon-32.png apple-touch-icon.png; do
            [ -f "$f" ] && cp "$f" www/ || true
          done
          # الصور المصغّرة (إن وُجد المجلد q) تُضمَّن في التطبيق ليعمل المصحف بدون إنترنت بالكامل
          if [ -d q ]; then cp -r q www/q; echo "bundled q/: $(ls q | wc -l) pages"; else echo "no q/ folder: Quran pages will load online"; fi

      - name: Add Android platform
        run: npx cap add android

      - name: Icons and manifest
        run: python3 scripts/prepare_android.py

      - name: Sync
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Collect APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk ruh-almuslim.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ruh-almuslim-apk
          path: ruh-almuslim.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: روح المسلم (بناء ${{ github.run_number }})
          files: ruh-almuslim.apk
